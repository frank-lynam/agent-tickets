[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "agent-tickets"
description = "A small ticket tracker for AI agents and the human who reviews their work: one stdlib-only file, SQLite, server-rendered pages and a JSON API."
dynamic = ["version"]   # from agent_tickets.__version__
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frank Lynam" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["tickets", "issue-tracker", "agents", "ai", "llm", "kanban", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/frank-lynam/agent-tickets"
Issues = "https://github.com/frank-lynam/agent-tickets/issues"

[project.scripts]
agent-tickets = "agent_tickets:cli"

[tool.flit.module]
name = "agent_tickets"

[tool.flit.sdist]
include = ["test_agent_tickets.py"]
exclude = ["CLAUDE.md", "AGENTS.md", "data/"]
